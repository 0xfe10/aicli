commands:
  - name: example status
    mode: read
    description: Check service authentication and configuration.
    output: json
  - name: example resource list
    mode: read
    description: List resources with pagination metadata.
    output: json
  - name: example resource update
    mode: write
    description: Plan or apply a resource update.
    dry_run_default: true
    apply_flag: --apply
    output: json

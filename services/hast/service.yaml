id: hast
name: Hast AIP
status: active
implementation:
  type: mcp2cli-command
  package: ./cmd/hast
  command: hast
  runtime: mcp2cli@0.1.10
authentication:
  supported: [public-api-key]
  header: Authorization
  scheme: Bearer
  local_commands: [auth login --mode key, auth status, auth logout]
  config_path: $XDG_CONFIG_HOME/aicli/hast/config.toml
  environment_override: true
surface:
  source: https://backend.hast.so/api/public/v1/mcp
  generation: runtime-mcp-discovery
safety:
  write_mode_default: readonly
notes:
  - Existing auth configuration and contexts remain valid.
  - MCP tools, resources and prompts reflect the selected key's Profile and scopes.
  - The authenticated local bridge guards all tool calls, with no automatic write replay.
  - Runtime artifacts support Linux and macOS amd64/arm64.

surface:
  source: https://backend.hast.so/api/public/v1/mcp
  generation: runtime-mcp-discovery
  naming: upstream-mcp-tool-names
  coverage: authorized-tools-resources-prompts
support_commands:
  discovery: [ls, inspect, ping, doctor]
  auth: [auth login --mode key, auth status, auth logout]
  context: [context current, context list, context use]
arguments:
  convention: nested-path-query-body-upload
  preferred: [--args-json, --args-file]
write_policy:
  environment: HAST_WRITE_MODE
  default: readonly
  write: non-destructive-tool-calls
  destructive: also-permits-deletions
retry_policy:
  writes: no-transparent-replay-or-redirects
output:
  structured_flag: --json
  failures: nonzero-exit-for-mcp-isError-or-http-failure

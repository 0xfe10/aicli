id: pingcode
name: PingCode
status: active
implementation:
  type: go-command
  repository: https://github.com/0xfe10/aicli
  package: ./cmd/pingcode
  command: pingcode
  transport: embedded-restish-v2.3.0
  api_description: https://open.pingcode.com/api_data.json
  api_description_format: pingcode-api-data
authentication:
  supported:
    - access-token
    - client-credentials
  default: client-credentials
  local_commands:
    - auth login --mode client
    - auth login --mode token
    - auth status
    - auth logout
  config_path: $XDG_CONFIG_HOME/aicli/pingcode/config.toml
  environment_override: true
safety:
  write_mode_default: readonly
  write_modes:
    readonly: [GET, HEAD, OPTIONS]
    write: [GET, HEAD, OPTIONS, POST, PUT, PATCH]
    destructive: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE]
notes:
  - Restish generates the operation commands and executes API requests.
  - The local adapter converts PingCode's vendor API description to OpenAPI 3.1.
  - Local auth stores client or token credentials in config.toml; OAuth is not included.
  - Secrets are entered interactively; argv flags for secrets are rejected.
openwiki:
  overview: openwiki/architecture/cli-platform.md
  contract: openwiki/decisions/service-cli-contract.md
  pingcode: openwiki/architecture/pingcode-milestone0.md

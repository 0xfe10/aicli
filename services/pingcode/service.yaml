id: pingcode
name: PingCode
status: planned
implementation:
  type: external
  repository: https://github.com/0xfe10/pingcode-mcp
  source_authority: main@9e7589f39535aed35b03ff9c191f1f55cd7b79a2
  package: "@succaiss/pingcode-mcp"
  command: pingcode
contract:
  stdout: single-json-document
  stderr: diagnostics-only
  writes_default_to_dry_run: true
  apply_flag: --apply
  expected_state_guard: expected-current-state
  secrets_in_output: forbidden
notes:
  - Reuse the existing PingCode client, auth store, auth service, and work item service.
  - Keep the MCP adapter during migration as a comparison and rollback path.
  - Do not expose all PingCode REST endpoints as first-class AI commands.
openwiki:
  overview: openwiki/architecture/cli-platform.md
  contract: openwiki/decisions/service-cli-contract.md

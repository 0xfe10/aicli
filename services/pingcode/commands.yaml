surface:
  source: https://open.pingcode.com/api_data.json
  generation: runtime
  layout: tags
  naming: deterministic-method-and-path
  coverage: all-supported-http-records
  excluded:
    - token and OAuth endpoints handled outside the generated API surface
    - records with unsupported HTTP methods
support_commands:
  namespace: pingcode cli
examples:
  - name: pingcode pjm get-projects
    mode: read
  - name: pingcode pjm get-work-items-by-work-item-id
    mode: read
  - name: pingcode pjm post-work-items
    mode: write
write_policy:
  environment: PINGCODE_WRITE_MODE
  default: readonly
  write: permits POST, PUT, PATCH
  destructive: also permits DELETE
output:
  owner: restish
  formats: [auto, json, yaml, table, csv, tsv, markdown, raw]
  filtering: restish
  pagination: restish
